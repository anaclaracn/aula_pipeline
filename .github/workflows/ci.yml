name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Nome completo da imagem no GitHub Container Registry (ghcr.io)
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ============================================================
  # Requisito 1 — Gitleaks: detecção de segredos no histórico
  # Falha o pipeline (exit-code 1) ao encontrar qualquer segredo.
  # ============================================================
  gitleaks:
    name: Gitleaks — detecção de segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      # --exit-code 1 bloqueia o merge quando um possível vazamento é detectado
      - name: Executar Gitleaks (bloqueante)
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

  # ============================================================
  # Construção e testes — etapas preservadas das atividades anteriores
  # ============================================================
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar aplicação
        run: python main.py

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest

      - name: Executar testes (pytest)
        run: pytest -q

  # ============================================================
  # Requisito 2 — SonarCloud: SAST + Quality Gate (código novo)
  # Requer: secret SONAR_TOKEN + variáveis SONAR_ORGANIZATION e SONAR_PROJECT_KEY.
  # sonar.qualitygate.wait=true faz o job falhar se o Quality Gate reprovar.
  # ============================================================
  sonarcloud:
    name: SonarCloud — análise estática (SAST)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências e ferramentas de cobertura
        run: pip install -r requirements.txt pytest pytest-cov

      # Gera coverage.xml, consumido pelo SonarCloud no Quality Gate
      - name: Executar testes com cobertura
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Análise SonarCloud (Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=main.py
            -Dsonar.tests=test_main.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

  # ============================================================
  # Requisitos 3 e 4 — Trivy (dependências + imagem) e Syft (SBOM)
  # ============================================================
  security-scan:
    name: Trivy + Syft
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trivy — dependências do projeto (fs)
      # Bloqueia CRITICAL e HIGH apenas quando há correção disponível (ignore-unfixed).
      - name: Trivy — scan de dependências (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Construir imagem Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Trivy — imagem Docker
      # Bloqueia CRITICAL e HIGH com correção disponível.
      - name: Trivy — scan da imagem (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Trivy — LOW e MEDIUM: apenas relatório, sem bloquear (exit-code 0)
      - name: Trivy — relatório LOW/MEDIUM (não bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'trivy-report-low-medium.json'
          exit-code: '0'
          severity: 'LOW,MEDIUM'

      - name: Publicar relatório Trivy (LOW/MEDIUM)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-low-medium
          path: trivy-report-low-medium.json

      # Syft — geração do SBOM da imagem
      - name: Gerar SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Publicar SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ============================================================
  # Publicação da imagem — depende do sucesso de todas as verificações.
  # Executa apenas no push para main (não publica em PR nem versões vulneráveis).
  # ============================================================
  publish:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest
    needs: [ gitleaks, build-test, sonarcloud, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
